name: Deploy to cPanel

# A cada push na main:
# 1. Converte TanStack Start (SSR) -> SPA estatico
# 2. Roda o build do Vite (gera ./dist)
# 3. Verifica que o dist tem CSS+JS injetados (senao aborta)
# 4. Limpa /public_html (preservando pastas do cPanel) e sobe SOMENTE o conteudo de dist/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Limpar saidas antigas (dist, .output, .nitro)
        run: rm -rf dist .output .nitro

      - name: Criar .env.production
        run: |
          cat > .env.production <<EOF
          VITE_SUPABASE_URL=https://vhwhugcwrsltqlrlssyg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZod2h1Z2N3cnNsdHFscmxzc3lnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTAxODgsImV4cCI6MjA5NTgyNjE4OH0.kOsrd1_t-jzcV67M3d_fNga9OfQyvk7hMJkfUfoYd_c
          VITE_SUPABASE_PROJECT_ID=vhwhugcwrsltqlrlssyg
          EOF

      - name: Converter SSR -> SPA estatico
        run: node convert-to-spa.mjs

      - name: Instalar dependencias
        run: bun install

      - name: Build (gera dist/)
        run: bun run build

      - name: Copiar .htaccess, robots.txt e sitemap.xml para dist/
        run: |
          [ -f public/.htaccess ]   && cp public/.htaccess   dist/.htaccess   || true
          [ -f public/robots.txt ]  && cp public/robots.txt  dist/robots.txt  || true
          [ -f public/sitemap.xml ] && cp public/sitemap.xml dist/sitemap.xml || true

      - name: Sanity check do dist/index.html
        run: |
          set -e
          echo "Conteudo de dist/:"
          ls -la dist/
          if [ ! -f dist/index.html ]; then
            echo "ERRO: dist/index.html nao existe. Build falhou."
            exit 1
          fi
          if ! grep -q '<script' dist/index.html; then
            echo "ERRO: dist/index.html nao tem <script> - build SPA quebrado (provavel saida SSR)."
            exit 1
          fi
          if ! grep -qE '(<link[^>]+stylesheet|\.css")' dist/index.html; then
            echo "ERRO: dist/index.html nao referencia CSS - build SPA quebrado."
            exit 1
          fi
          if [ ! -d dist/assets ]; then
            echo "ERRO: dist/assets nao existe."
            exit 1
          fi
          echo "OK: dist/ valido para deploy."

      - name: Bloquear saidas SSR no payload
        # Garantia extra: se por algum motivo dist tiver artefato SSR, falhe.
        run: |
          set -e
          for f in dist/_worker.js dist/server.js dist/index.server.html dist/.output dist/.nitro; do
            if [ -e "$f" ]; then
              echo "ERRO: artefato SSR encontrado em $f - abortando deploy."
              exit 1
            fi
          done

      - name: Deploy via FTP para /public_html (limpa antes de subir)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /public_html/
          protocol: ftp
          port: 21
          # Apaga TUDO em /public_html antes de subir, EXCETO os caminhos do exclude.
          # Assim nunca sobra arquivo antigo (incluindo saidas SSR de uploads anteriores).
          dangerous-clean-slate: true
          # Pastas/arquivos do cPanel que NUNCA devem ser apagados nem sobrescritos.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**
            .well-known/**
            .htpasswd*
            error_log
            php.ini
            .user.ini
